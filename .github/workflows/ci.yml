name: CI
on:
  push: { branches: [main], paths-ignore: ['website/**', '**.md', 'tools/update_site.py', '.github/workflows/site.yml'] }
  pull_request: { paths-ignore: ['website/**', '**.md', 'tools/update_site.py', '.github/workflows/site.yml'] }
  workflow_call:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v0.0.0-dev' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,       name: macOS,   targets: "FlatQ_VST3 FlatQ_AU FlatQ_Standalone", archs: "arm64;x86_64" }
          - { os: windows-latest, name: Windows, targets: "FlatQ_VST3 FlatQ_Standalone",           archs: "" }
          - { os: ubuntu-latest,  name: Linux,   targets: "FlatQ_VST3 FlatQ_Standalone",           archs: "" }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: build/_deps/juce-src
          key: juce-8.0.4-${{ runner.os }}

      - name: Configure
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.archs != '' && format('-DCMAKE_OSX_ARCHITECTURES="{0}"', matrix.archs) || '' }}

      - name: Build
        shell: bash
        run: |
          for t in ${{ matrix.targets }}; do cmake --build build --config Release --target $t --parallel; done
          cmake --build build --config Release --target lvls_dump design_test flatq_convert --parallel

      - name: Test (parse sample profiles)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Validate AU (informational)
        if: runner.os == 'macOS'
        continue-on-error: true   # AU registration on fresh CI runners is unreliable; run `make validate` locally
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/FlatQ_artefacts/Release/AU/flatQ.component ~/Library/Audio/Plug-Ins/Components/
          codesign --force --deep -s - ~/Library/Audio/Plug-Ins/Components/flatQ.component
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -v aufx FlQp FlTq

      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          cd build/FlatQ_artefacts/Release
          if [ "$RUNNER_OS" = macOS ]; then
            for d in VST3/flatQ.vst3 AU/flatQ.component Standalone/flatQ.app; do codesign --force --deep -s - "$d"; done
            ditto -c -k --keepParent VST3/flatQ.vst3 ../../../dist/flatQ-VST3-macOS.zip
            ditto -c -k --keepParent AU/flatQ.component ../../../dist/flatQ-AU-macOS.zip
            ditto -c -k --keepParent Standalone/flatQ.app ../../../dist/flatQ-Standalone-macOS.zip
            cd ../../..
            installers/macos/build-pkg.sh "$VERSION"
            cd build/FlatQ_artefacts/Release
          elif [ "$RUNNER_OS" = Windows ]; then
            7z a ../../../dist/flatQ-VST3-Windows.zip VST3/flatQ.vst3
            7z a ../../../dist/flatQ-Standalone-Windows.zip Standalone/flatQ.exe
            cd ../../..
            ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            [ -x "$ISCC" ] || { choco install innosetup -y --no-progress; }
            "$ISCC" "//DAppVersion=${VERSION#v}" installers/windows/flatq.iss
            cd build/FlatQ_artefacts/Release
          else
            zip -r ../../../dist/flatQ-VST3-Linux.zip VST3/flatQ.vst3
            zip -r ../../../dist/flatQ-Standalone-Linux.zip Standalone/flatQ
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: flatQ-${{ matrix.name }}
          path: |
            dist/*.zip
            dist/*.pkg
            dist/*.exe
