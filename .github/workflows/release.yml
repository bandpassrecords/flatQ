name: Release
# Tag e.g. v0.1.0 -> builds all platforms and attaches the zips to a GitHub release.
on:
  push: { tags: ["v*"] }
permissions: { contents: write, actions: write }

jobs:
  build:
    uses: ./.github/workflows/ci.yml
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: flatQ-*
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
          generate_release_notes: true
      - name: Update the download links on the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run site.yml --repo "${{ github.repository }}" --ref main
